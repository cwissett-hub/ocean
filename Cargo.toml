[package]
name = "ocean"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
bytemuck = { version = "1.25", features = ["derive"] }
egui = { version = "0.37.0" }
egui-wgpu = { version = "0.37.0" }
egui-winit = { version = "0.37.0" }
glam = { version = "0.34.1" }
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster = { version = "1" }
rustfft = { version = "6.4.1" }
wgpu = { version = "30.0.1" }
winit = { version = "0.30.13" }

[profile.dev.package."*"]
opt-level = 2
